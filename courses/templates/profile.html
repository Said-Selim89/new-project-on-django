<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>
<body>
    <h1>{{ title }}</h1>
    
    <p><strong>Имя:</strong> {{ user.name }}</p>
    <p><strong>Возраст:</strong> {{ user.age }}</p>
    
    <h3>Навыки:</h3>
    <ul>
        {% for skill in skills %}
        <li>{{ skill }}</li>
        {% endfor %}
    </ul>
    
    <h3>Местоположение:</h3>
    <p><strong>Город:</strong> {{ location.0 }}</p>
    <p><strong>Страна:</strong> {{ location.1 }}</p>
</body>
</html>
